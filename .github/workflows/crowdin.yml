name: Crowdin Sync

on:
  push:
    branches: [ master ]
    paths:
      - 'Beyond Numbers with STT/lang/en-US.json'
      - 'crowdin.yml'
  schedule:
    # Once a day: pull finished translations from Crowdin into a pull request.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      upload_translations:
        description: 'Also upload the existing translation files to Crowdin (one-time import)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: crowdin-sync
  cancel-in-progress: false

jobs:
  synchronize-with-crowdin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Sync with Crowdin
        uses: crowdin/github-action@v2
        with:
          config: crowdin.yml
          upload_sources: true
          upload_translations: ${{ inputs.upload_translations || false }}
          download_translations: true
          localization_branch_name: l10n_crowdin
          create_pull_request: true
          pull_request_title: 'New translations from Crowdin'
          pull_request_body: 'Automated translation update from Crowdin.'
          pull_request_base_branch_name: master
          commit_message: 'Update translations from Crowdin'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
